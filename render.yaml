services:
  - type: web
    name: whatsapp-bot
    env: node
    buildCommand: npm install --legacy-peer-deps
    startCommand: node src/index.js
    envVars:
      - key: PREFIX
        value: "!"
      - key: TIMEZONE
        value: Africa/Nairobi
      - key: SESSION_ID
        value: ""
      - key: OWNER_NUMBER
        value: "+254111783552"
      - key: NODE_ENV
        value: production
